# Nginx site for brandingcatalyst.in on the Hostinger VPS.
# Copy to /etc/nginx/sites-available/brandingcatalyst.in, link it into sites-enabled,
# then run certbot for HTTPS (see docs/DEPLOY-VPS.md). Certbot adds the 443 block itself.

server {
    listen 80;
    listen [::]:80;
    server_name brandingcatalyst.in www.brandingcatalyst.in;

    # www → main domain
    if ($host = www.brandingcatalyst.in) {
        return 301 https://brandingcatalyst.in$request_uri;
    }

    client_max_body_size 200k;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/xml text/plain image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;          # same PORT as deploy/ecosystem.config.cjs
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # overwrite (not append) so visitors cannot fake their IP for the rate limits
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
